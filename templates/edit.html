{% extends "base.html" %}

{% block content %}
<h2>✏️ Edit Data Mahasiswa</h2>

<form method="POST">
    <div class="form-group">
        <label>NIM</label>
        <input type="text" value="{{ mahasiswa.nim }}" disabled style="background:#f0f0f0;">
        <small style="color: #666;">NIM tidak dapat diubah</small>
    </div>

    <div class="form-group">
        <label>Nama Lengkap *</label>
        <input type="text" name="nama" value="{{ mahasiswa.nama }}" required>
    </div>

    <div class="form-group">
        <label>Email *</label>
        <input type="email" name="email" value="{{ mahasiswa.email }}" required>
    </div>

    <div class="form-group">
        <label>Jurusan *</label>
        <input type="text" name="jurusan" value="{{ mahasiswa.jurusan }}" required>
    </div>

    <button type="submit" class="btn btn-primary">💾 Update Data</button>
    <a href="{{ url_for('index') }}" class="btn btn-info">↩️ Kembali</a>
</form>
{% endblock %}
