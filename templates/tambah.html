{% extends "base.html" %}

{% block content %}
<h2>➕ Tambah Mahasiswa Baru</h2>

<form method="POST">
    <div class="form-group">
        <label>NIM (8-12 digit angka) *</label>
        <input type="text" name="nim" required pattern="\d{8,12}" title="NIM harus 8-12 digit angka">
    </div>

    <div class="form-group">
        <label>Nama Lengkap *</label>
        <input type="text" name="nama" required>
    </div>

    <div class="form-group">
        <label>Email *</label>
        <input type="email" name="email" required>
        <small style="color: #666;">Contoh: nama@domain.com</small>
    </div>

    <div class="form-group">
        <label>Jurusan *</label>
        <input type="text" name="jurusan" required placeholder="Contoh: Teknik Informatika">
    </div>

    <button type="submit" class="btn btn-primary">💾 Simpan Data</button>
    <a href="{{ url_for('index') }}" class="btn btn-info">↩️ Kembali</a>
</form>
{% endblock %}
